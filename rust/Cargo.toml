[package]
name = "psbt-spec"
version = "0.1.0"
edition = "2021"
description = "Executable declarative specification of PSBT v0 (BIP-174) and v2 (BIP-370) validity"
license = "CC0-1.0"

[dependencies]
base64 = "0.22"
bitcoin_hashes = "0.14"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
serde_json = "1"
