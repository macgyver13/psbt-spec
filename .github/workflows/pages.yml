name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --release
      - name: Render site
        working-directory: rust
        env:
          PSBT_SPEC_SOURCE_BASE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/
        run: PSBT_SPEC_REVISION=$(git rev-parse --short HEAD) cargo run --release --bin render -- --site ../site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
