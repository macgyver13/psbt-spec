[package]
name = "psbt-spec-adapter-spdk"
version = "0.1.0"
edition = "2021"
publish = false

# Not a member of psbt-spec's rust/ workspace.
[workspace]

[dependencies]
psbt = { path = "../../../spdk/psbt" }
# Same source and rev as the spdk workspace pins, so that it is the one crate `psbt` uses.
psbt-v2 = { git = "https://gitea.bitcoin.ninja/macgyver/rust-psbt.git", rev = "b1728695eedf84060000b693b464630ec95c920c", features = ["silent-payments", "miniscript"] }
serde_json = "1"

# Mirrors the TEMP [patch] at the end of spdk/Cargo.toml (a patch in a dependency's workspace does
# not apply to this crate). Remove it to build against the pinned rev above.
[patch."https://gitea.bitcoin.ninja/macgyver/rust-psbt.git"]
psbt-v2 = { path = "../../../rust-psbt" }
